version: "3.9"

services:
  erwin-gateway-migrate:
    image: ghcr.io/your-org/erwin-gateway:latest
    container_name: erwin-gateway-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TZ: UTC
      DATABASE_URL: postgres://erwin:change-me@postgres:5432/erwin_gateway
    command: ["npm", "run", "db:migrate"]

  erwin-gateway:
    image: ghcr.io/your-org/erwin-gateway:latest
    container_name: erwin-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      TZ: UTC
      HOST: 0.0.0.0
      PORT: 3000

      DATABASE_URL: postgres://erwin:change-me@postgres:5432/erwin_gateway
      PUBLIC_APP_URL: https://gateway.example.com
      PUBLIC_API_URL: https://gateway.example.com
      TWITCH_EVENTSUB_CALLBACK_URL: https://gateway.example.com/webhooks/twitch/eventsub
      CORS_ORIGIN: https://gateway.example.com

      SESSION_SECRET: change-me-session-secret-min-32
      TOKEN_ENCRYPTION_KEY: change-me-token-encryption-key-min-32
      API_KEY_PEPPER: change-me-api-key-pepper-min-16
      INTERNAL_ADMIN_API_KEY: change-me-admin-api-key-min-16

      TWITCH_CLIENT_ID: your-twitch-client-id
      TWITCH_CLIENT_SECRET: your-twitch-client-secret
      TWITCH_EVENTSUB_SECRET: change-me-long-random-secret

      TWITCH_BOT_LOGIN: your-bot-login
      TWITCH_BOT_USER_ID: your-bot-user-id
      TWITCH_BROADCASTER_ID: your-broadcaster-user-id
      TWITCH_CHANNEL_LOGIN: your-channel-login

      LOG_HEALTHCHECK_REQUESTS: "false"

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-lc", "npm run db:migrate && node apps/api/dist/server.js"]

  postgres:
    image: postgres:16-alpine
    container_name: erwin-gateway-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: erwin_gateway
      POSTGRES_USER: erwin
      POSTGRES_PASSWORD: change-me
    volumes:
      - erwin_gateway_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erwin -d erwin_gateway"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  erwin_gateway_postgres:
